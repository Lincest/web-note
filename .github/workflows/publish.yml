name: Build & Publish

on:
  push:
    tags: ["web-note/v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^web-note/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Build and verify PHP runtime
        run: |
          docker build --pull -t web-note:test .
          docker run --rm --entrypoint php web-note:test -l /var/www/html/index.php
          docker run --rm --entrypoint php web-note:test -r 'exit(version_compare(PHP_VERSION, "8.4.27", ">=") && !ini_get("session.upload_progress.enabled") ? 0 : 1);'
      - name: Verify HTTP behavior
        run: |
          docker run -d --name web-note-test -p 127.0.0.1:8080:80 web-note:test
          trap 'docker rm -f web-note-test' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py http://127.0.0.1:8080
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: |
            ghcr.io/lincest/web-note:${{ env.VERSION }}
            ghcr.io/lincest/web-note:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Lincest/web-note
            org.opencontainers.image.revision=${{ github.sha }}
